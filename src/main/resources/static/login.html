<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Tracker - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .auth-container h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }
        .auth-container h5 {
            color: #666;
        }
        .form-control {
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            color: #333;
            background-color: white;
        }
        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-primary {
            background-color: #667eea;
            border: none;
        }
        .btn-primary:hover {
            background-color: #764ba2;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .toggle-form {
            text-align: center;
            margin-top: 15px;
        }
        .toggle-form a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }
        .alert {
            margin-top: 15px;
        }
        #registerForm {
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Login Form -->
        <div id="loginForm">
            <h1>🎵 Spotify Tracker</h1>
            <h5 style="text-align: center; color: #666; margin-bottom: 30px;">Login to Your Account</h5>

            <input type="email" id="loginEmail" class="form-control" placeholder="Email" required>
            <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
            <button class="btn btn-primary" onclick="handleLogin()">Login</button>

            <div class="toggle-form">
                Don't have an account? <a onclick="toggleForms()">Register here</a>
            </div>
            <div id="loginResult"></div>
        </div>

        <!-- Register Form -->
        <div id="registerForm">
            <h1>🎵 Spotify Tracker</h1>
            <h5 style="text-align: center; color: #666; margin-bottom: 30px;">Create New Account</h5>

            <input type="email" id="registerEmail" class="form-control" placeholder="Email" required>
            <input type="text" id="displayName" class="form-control" placeholder="Display Name" required>
            <input type="password" id="registerPassword" class="form-control" placeholder="Password" required>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
            <button class="btn btn-primary" onclick="handleRegister()">Register</button>

            <div class="toggle-form">
                Already have an account? <a onclick="toggleForms()">Login here</a>
            </div>
            <div id="registerResult"></div>
        </div>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('loginForm').style.display =
                document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display =
                document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const resultDiv = document.getElementById('loginResult');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const text = await response.text();

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${text}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        async function handleRegister() {
            const email = document.getElementById('registerEmail').value;
            const displayName = document.getElementById('displayName').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultDiv = document.getElementById('registerResult');

            if (password !== confirmPassword) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Passwords do not match!</div>';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, displayName, password })
                });

                const text = await response.text();

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="alert alert-success">Account created! Logging in...</div>';
                    setTimeout(() => {
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginPassword').value = password;
                        handleLogin();
                    }, 1000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${text}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        // Check if already logged in
        window.addEventListener('load', async () => {
            const response = await fetch('/api/auth/me', {
                credentials: 'include'
            });
            if (response.ok) {
                window.location.href = '/dashboard.html';
            }
        });
    </script>
</body>
</html>
